name: CI Workflow

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

env:
  GO_VERSION: "1.26"
  DOTNET_VERSION: 9.0.x
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_VERSION: 20.x
  PYTHON_VERSION: "3.11"

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          advanced-security: false # Fail on findings instead of uploading SARIF.
          annotations: true

  main:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags
      - name: Install Go Tools
        uses: $/.github/actions/gotools
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Pulumi Tools
        uses: $/.github/actions/pulumitools
      - name: Build sdks
        run: make generate_sdks
      - name: Lint provider
        run: make lint_provider
      - name: Execute tests
        run: make test

  config:
    name: Check GoReleaser config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: check