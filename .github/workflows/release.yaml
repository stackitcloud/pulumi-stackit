name: release
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions: {}

env:
  GITHUB_TOKEN: ${{ secrets.PR_TOKEN }}
  PROVIDER: stackit
  PULUMI_GO_DEP_ROOT: ${{ github.workspace }}/..
  PUBLISH_NPM: true
jobs:
  publish_binary:
    name: Publish provider
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub release and upload provider artifacts.
      id-token: write # Sign artifacts with cosign using OIDC.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags
      - name: Install pulumictl
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # tag=v4.0.0
        with:
          repo: pulumi/pulumictl
      - name: Install Go Tools
        uses: $/.github/actions/gotools
        with:
          go-version: ${{ matrix.goversion }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: -p 3 release --clean
          version: '~> v2'
    strategy:
      fail-fast: true
      matrix:
        goversion:
          - 1.26.x
  publish_sdk:
    name: Build SDKs and publish to npm
    runs-on: ubuntu-latest
    needs: publish_binary
    permissions:
      contents: read
      id-token: write # Authenticate npm publishing using OIDC.
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unshallow clone for tags
        run: git fetch --prune --unshallow --tags
      - name: Install Go Tools
        uses: $/.github/actions/gotools
        with:
          go-version: ${{ matrix.goversion }}
      - name: Install Pulumi Tools
        uses: $/.github/actions/pulumitools
        with:
          dotnet-version: ${{matrix.dotnetverson}}
          node-version: ${{matrix.nodeversion}}
          python-version: ${{matrix.pythonversion}}
      - name: Build SDK
        run: make build_${{ matrix.language }}
      - name: Check worktree clean
        run: |
          git update-index -q --refresh
          if ! git diff-files --quiet; then
              >&2 echo "error: working tree is not clean, aborting!"
              git status
              git diff
              exit 1
          fi
      - if: ${{ matrix.language == 'nodejs' }}
        name: Run type script unit tests
        run: make test_ts
      - if: ${{ matrix.language == 'nodejs' && env.PUBLISH_NPM == 'true' }}
        run: |
          npm publish ${{github.workspace}}/sdk/nodejs/bin --access public
    strategy:
      fail-fast: true
      matrix:
        dotnetversion:
          - 9.0.x
        goversion:
          - 1.26.x
        language:
          - nodejs
          - python
          - dotnet
          - go
        nodeversion:
          - 25.2.1
        pythonversion:
          - "3.11"
